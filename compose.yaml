name: fixly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixly
      POSTGRES_USER: fixly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-docker.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixly -d fixly"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fixly
      SPRING_DATASOURCE_USERNAME: fixly
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-docker.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run ./scripts/setup-docker.sh first}
      TZ: Europe/London
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./fixly-frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FIXLY_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: fixly_test
      POSTGRES_USER: fixly_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-docker.sh first}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixly_test -d fixly_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://test-db:5432/fixly_test
      SPRING_DATASOURCE_USERNAME: fixly_test
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-docker.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run ./scripts/setup-docker.sh first}
      TZ: Europe/London
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
